[package]
name = "telecat-grid"
version.workspace = true
edition.workspace = true
license.workspace = true
autoexamples = false

[[example]]
name = "grid-scenario"
path = "examples/scenario.rs"

[[example]]
name = "grid-bench-model"
path = "examples/bench_model.rs"

[dependencies]
telecat-theme = { path = "../theme" }
gpui-kit = { version = "=0.7.3", default-features = false }
telecat-core.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-apple = { package = "gpui-pre-apple", version = "=0.3.9", features = ["font-kit"] }
