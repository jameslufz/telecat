[package]
name = "telecat-db"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
telecat-core.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
mysql_async = { version = "0.36", default-features = false, features = ["minimal-rust", "rustls-tls", "ring"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-pemfile = "2"
bytes = "1"
flate2 = "1"
futures-util = "0.3"
regex.workspace = true

[features]
# A loopback proxy for tests that cut or blackhole the network (src/test_proxy.rs).
test-support = []

[dev-dependencies]
telecat-db = { path = ".", features = ["test-support"] }
